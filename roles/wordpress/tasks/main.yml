---
- name: Validate required WordPress settings
  ansible.builtin.assert:
    that:
      - wordpress_domain | default('') | length > 0
      - wordpress_letsencrypt_email | default('') | length > 0
      - wordpress_admin_email | default('') | length > 0
      - wordpress_db_password | default('') | string | length > 0
      - wordpress_admin_password | default('') | string | length > 0
    fail_msg: >-
      Set the WordPress domain and email values in group_vars/webservers.yml,
      and define wordpress_db_password and wordpress_admin_password using
      Ansible Vault.

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install or update WordPress stack packages
  ansible.builtin.apt:
    name: "{{ wordpress_packages }}"
    state: latest

- name: Create Let's Encrypt deploy hook directory
  ansible.builtin.file:
    path: /etc/letsencrypt/renewal-hooks/deploy
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Reload Apache after certificate renewal
  ansible.builtin.copy:
    dest: /etc/letsencrypt/renewal-hooks/deploy/reload-apache
    content: |
      #!/bin/sh
      systemctl reload apache2
    owner: root
    group: root
    mode: '0750'

- name: Start and enable MariaDB
  ansible.builtin.service:
    name: mariadb
    state: started
    enabled: true

- name: Create WordPress database
  ansible.mysql.mysql_db:
    name: "{{ wordpress_db_name }}"
    state: present
    encoding: utf8mb4
    collation: utf8mb4_unicode_ci
    login_unix_socket: /run/mysqld/mysqld.sock

- name: Create WordPress database user
  ansible.mysql.mysql_user:
    name: "{{ wordpress_db_user }}"
    password: "{{ wordpress_db_password }}"
    priv: "{{ wordpress_db_name }}.*:ALL"
    host: localhost
    state: present
    login_unix_socket: /run/mysqld/mysqld.sock
  no_log: true

- name: Create WordPress and ACME webroot directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: www-data
    group: www-data
    mode: '0755'
  loop:
    - "{{ wordpress_install_path }}"
    - "{{ wordpress_acme_webroot }}/.well-known/acme-challenge"

- name: Download the latest WordPress release
  ansible.builtin.get_url:
    url: https://wordpress.org/latest.tar.gz
    dest: /tmp/wordpress-latest.tar.gz
    owner: root
    group: root
    mode: '0644'

- name: Extract WordPress files
  ansible.builtin.unarchive:
    src: /tmp/wordpress-latest.tar.gz
    dest: /var/www
    remote_src: true
    creates: "{{ wordpress_install_path }}/wp-includes/version.php"

- name: Set WordPress file ownership
  ansible.builtin.file:
    path: "{{ wordpress_install_path }}"
    state: directory
    owner: www-data
    group: www-data
    recurse: true

- name: Download WP-CLI
  ansible.builtin.get_url:
    url: https://raw.githubusercontent.com/wp-cli/builds/gh-pages/phar/wp-cli.phar
    dest: /usr/local/bin/wp
    owner: root
    group: root
    mode: '0755'

- name: Create WordPress configuration
  ansible.builtin.command:
    argv:
      - wp
      - config
      - create
      - "--dbname={{ wordpress_db_name }}"
      - "--dbuser={{ wordpress_db_user }}"
      - --dbhost=localhost
      - "--path={{ wordpress_install_path }}"
      - --skip-check
      - --prompt=dbpass
    creates: "{{ wordpress_install_path }}/wp-config.php"
    stdin: "{{ wordpress_db_password }}"
    stdin_add_newline: true
  become_user: www-data
  no_log: true

- name: Restrict access to WordPress configuration
  ansible.builtin.file:
    path: "{{ wordpress_install_path }}/wp-config.php"
    state: file
    owner: root
    group: www-data
    mode: '0640'

- name: Check whether WordPress is already installed
  ansible.builtin.command:
    argv:
      - wp
      - core
      - is-installed
      - "--path={{ wordpress_install_path }}"
  become_user: www-data
  register: wordpress_install_status
  changed_when: false
  failed_when: false

- name: Install WordPress site and administrator
  ansible.builtin.command:
    argv:
      - wp
      - core
      - install
      - "--url=https://{{ wordpress_domain }}"
      - "--title={{ wordpress_site_title }}"
      - "--admin_user={{ wordpress_admin_user }}"
      - "--admin_email={{ wordpress_admin_email }}"
      - --skip-email
      - "--path={{ wordpress_install_path }}"
      - --prompt=admin_password
    stdin: "{{ wordpress_admin_password }}"
    stdin_add_newline: true
  become_user: www-data
  when: wordpress_install_status.rc != 0
  no_log: true

- name: Enable Apache rewrite module
  ansible.builtin.command:
    cmd: a2enmod rewrite
    creates: /etc/apache2/mods-enabled/rewrite.load
  notify: Reload Apache

- name: Enable Apache SSL module
  ansible.builtin.command:
    cmd: a2enmod ssl
    creates: /etc/apache2/mods-enabled/ssl.load
  notify: Reload Apache

- name: Check for an existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ wordpress_domain }}/fullchain.pem"
  register: wordpress_certificate

- name: Configure temporary HTTP virtual host for certificate issuance
  ansible.builtin.template:
    src: wordpress-http.conf.j2
    dest: /etc/apache2/sites-available/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  when: not wordpress_certificate.stat.exists
  notify: Reload Apache

- name: Configure HTTPS virtual host when a certificate exists
  ansible.builtin.template:
    src: wordpress-https.conf.j2
    dest: /etc/apache2/sites-available/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  when: wordpress_certificate.stat.exists
  notify: Reload Apache

- name: Enable WordPress Apache site
  ansible.builtin.file:
    src: /etc/apache2/sites-available/wordpress.conf
    dest: /etc/apache2/sites-enabled/wordpress.conf
    state: link
  notify: Reload Apache

- name: Start and enable Apache
  ansible.builtin.service:
    name: apache2
    state: started
    enabled: true

- name: Apply initial Apache configuration
  ansible.builtin.meta: flush_handlers

- name: Request Let's Encrypt certificate
  ansible.builtin.command:
    argv:
      - certbot
      - certonly
      - --webroot
      - --webroot-path
      - "{{ wordpress_acme_webroot }}"
      - --non-interactive
      - --agree-tos
      - --email
      - "{{ wordpress_letsencrypt_email }}"
      - --domain
      - "{{ wordpress_domain }}"
    creates: "/etc/letsencrypt/live/{{ wordpress_domain }}/fullchain.pem"
  when: not wordpress_certificate.stat.exists

- name: Configure HTTPS virtual host
  ansible.builtin.template:
    src: wordpress-https.conf.j2
    dest: /etc/apache2/sites-available/wordpress.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload Apache

- name: Start and enable automatic certificate renewal
  ansible.builtin.systemd_service:
    name: certbot.timer
    state: started
    enabled: true
