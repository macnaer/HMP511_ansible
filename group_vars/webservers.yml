---
packages_list:
  # setfacl is required by Ansible when a task uses become_user
  # (for example www-data in the WordPress role).
  - acl
  - curl
  - wget
  - git
  - vim
  - htop
  - unzip
  - net-tools

# WordPress stack packages are kept current from the Ubuntu 24.04 repositories.
wordpress_packages:
  - apache2
  - mariadb-client
  - mariadb-server
  - libapache2-mod-php
  - php
  - php-bcmath
  - php-cli
  - php-curl
  - php-gd
  - php-imagick
  - php-intl
  - php-mbstring
  - php-mysql
  - php-xml
  - php-zip
  - python3-pymysql
  - unzip

# When false, no Let's Encrypt certificate is requested and the site is served
# over plain HTTP on port 80. Set a real domain and switch to true to enable
# certificate issuance later.
wordpress_https_enabled: false
wordpress_domain: "{{ ansible_host }}"
wordpress_letsencrypt_email: ""
wordpress_admin_email: admin@example.com
wordpress_admin_user: wordpressadmin
wordpress_site_title: WordPress Site
wordpress_db_name: wordpress
wordpress_db_user: wordpress
wordpress_install_path: /var/www/wordpress
wordpress_acme_webroot: /var/lib/letsencrypt

# Ansible Vault encrypted WordPress passwords. Provide the Vault password at
# runtime with --ask-vault-pass; the Vault password is stored outside the
# repository. See README.md for the encrypt_string commands.
wordpress_db_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          39383330653633373062663736616134373931363231326463356361653663623761386635393832
          3830333639303336653435646131313931336333376532660a303063346239393034656132636639
          62373333356530326237656135626364613132303436353231643230353865663335313463316465
          3738333462356461650a306265303730656162653261313334663062623238356666373565616162
          3535
wordpress_admin_password: !vault |
          $ANSIBLE_VAULT;1.1;AES256
          37663134333363333534626234326234383635666636323833666331316261393661653262376439
          6534306365393633383831663435363533646437643133610a363432333962373965373236323435
          32316234366232646262623636353532343237333336323765663733323239613562393062353264
